<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>內容特工隊｜AI內容獲客工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#12192B;
    --paper:#F3EFE3;
    --accent:#F0B429;
    --accent-dark:#C98A1A;
    --card-gold:#F3DFB0;
    --card-teal:#BFDEDC;
    --card-rose:#F0D2D9;
    --card-lavender:#D9D6ED;
    --card-sage:#D2E3CE;
    --card-sky:#CDE1EF;
  }
  body{ font-family:'Noto Sans TC', sans-serif; background:var(--paper); }
  .display{ font-family:'Space Grotesk','Noto Sans TC', sans-serif; }
  .card-gold{ background:var(--card-gold); }
  .card-teal{ background:var(--card-teal); }
  .card-rose{ background:var(--card-rose); }
  .card-lavender{ background:var(--card-lavender); }
  .card-sage{ background:var(--card-sage); }
  .card-sky{ background:var(--card-sky); }
  .nav-item{ transition: all .15s ease; }
  .nav-item:hover{ background:rgba(255,255,255,0.06); }
  .nav-item.active{ background:var(--accent); color:var(--ink); font-weight:700; }
  .scrollbar-thin::-webkit-scrollbar{ width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:#33405C; border-radius:3px; }
  .card-note{ box-shadow: 4px 4px 0px rgba(18,25,43,0.9); border:1.5px solid var(--ink); }
  .btn-primary{ background:var(--accent); color:var(--ink); font-weight:700; border:1.5px solid var(--ink); box-shadow:3px 3px 0px var(--ink); transition: all .12s ease; }
  .btn-primary:hover{ transform: translate(1px,1px); box-shadow:2px 2px 0px var(--ink); }
  .btn-primary:active{ transform: translate(3px,3px); box-shadow:0px 0px 0px var(--ink); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .field-input{ border:1.5px solid var(--ink); background:#fff; }
  .field-input:focus{ outline:none; box-shadow: 0 0 0 3px rgba(240,180,41,0.45); }
  .fade-in{ animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .loading-dot{ animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }
  .prose-output{ white-space:pre-wrap; line-height:1.85; }
</style>
</head>
<body class="text-[#12192B]">

<div class="flex h-screen overflow-hidden">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="w-64 shrink-0 bg-[#12192B] text-[#E9E6DC] flex flex-col h-full">
    <div class="px-5 pt-6 pb-5 flex items-center gap-3 border-b border-white/10">
      <div class="w-9 h-9 rounded-md bg-[var(--accent)] flex items-center justify-center text-[#12192B] font-black display text-sm">◎</div>
      <div>
        <div class="font-bold text-[15px] leading-tight">內容特工隊</div>
        <div class="text-[11px] text-white/40 mt-0.5">一人品牌，AI大軍團</div>
      </div>
    </div>

    <nav id="sidebar-nav" class="flex-1 overflow-y-auto scrollbar-thin px-3 py-4 space-y-5 text-[13.5px]"></nav>

    <div class="px-4 py-3 border-t border-white/10">
      <button id="btn-brand-setting" class="nav-item w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-2 text-white/70 hover:text-white">
        <span>⚙️</span><span>品牌語氣設定</span>
      </button>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <main class="flex-1 h-full overflow-y-auto scrollbar-thin">
    <div class="max-w-5xl mx-auto px-8 py-8" id="main-content"></div>
  </main>
</div>

<!-- ===================== MODAL: 品牌設定 ===================== -->
<div id="brand-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl max-w-lg w-full p-6 card-note">
    <div class="flex items-center justify-between mb-1">
      <h3 class="text-lg font-black display">品牌語氣設定</h3>
      <button onclick="closeBrandModal()" class="text-2xl leading-none">&times;</button>
    </div>
    <p class="text-xs text-[#555] mb-4">填一次，之後所有生成模組都會自動套用你的品牌背景與語氣，讓輸出更一致。</p>
    <div class="space-y-3">
      <div>
        <label class="text-xs font-bold">IP / 品牌名稱</label>
        <input id="b-name" class="field-input w-full rounded-md px-3 py-2 mt-1 text-sm" placeholder="例：daxing 線上課程工作室">
      </div>
      <div>
        <label class="text-xs font-bold">產業 / 專業領域</label>
        <input id="b-industry" class="field-input w-full rounded-md px-3 py-2 mt-1 text-sm" placeholder="例：自媒體經營、內容變現教學">
      </div>
      <div>
        <label class="text-xs font-bold">目標受眾</label>
        <input id="b-audience" class="field-input w-full rounded-md px-3 py-2 mt-1 text-sm" placeholder="例：25-40歲想經營副業的上班族">
      </div>
      <div>
        <label class="text-xs font-bold">語氣風格</label>
        <input id="b-tone" class="field-input w-full rounded-md px-3 py-2 mt-1 text-sm" placeholder="例：專業但親切、像朋友分享實戰經驗">
      </div>
    </div>
    <button onclick="saveBrand()" class="btn-primary w-full rounded-lg py-2.5 mt-5 text-sm">儲存設定</button>
  </div>
</div>

<!-- ===================== MODAL: 歷史紀錄詳情 ===================== -->
<div id="history-detail-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl max-w-xl w-full p-6 card-note max-h-[80vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-1">
      <h3 id="hist-detail-title" class="text-base font-black display pr-4">紀錄內容</h3>
      <button onclick="closeHistoryDetail()" class="text-2xl leading-none shrink-0">&times;</button>
    </div>
    <div id="hist-detail-time" class="text-[11px] text-[#999] mb-4"></div>
    <div id="hist-detail-content" class="text-sm prose-output text-[#222]"></div>
    <div class="flex items-center gap-4 mt-5">
      <button id="hist-detail-copy" class="text-xs underline font-bold">複製內容</button>
      <button id="hist-detail-delete" class="text-xs underline font-bold text-[#B0433F]">刪除這筆紀錄</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: 選題詳情 ===================== -->
<div id="topic-detail-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl max-w-xl w-full p-6 card-note max-h-[80vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-1">
      <h3 id="topic-detail-title" class="text-base font-black display pr-4">選題內容</h3>
      <button onclick="closeTopicDetail()" class="text-2xl leading-none shrink-0">&times;</button>
    </div>
    <div id="topic-detail-type" class="text-[11px] inline-block px-2 py-0.5 rounded-full bg-[var(--card-teal)] mb-4"></div>
    <div id="topic-detail-content" class="text-sm prose-output text-[#222]"></div>
    <button id="topic-detail-select-btn" class="btn-primary rounded-lg px-4 py-2 text-sm mt-5">加入已選</button>
  </div>
</div>

<!-- ===================== 浮動狀態列：選題策劃選擇狀態 ===================== -->
<div id="topic-status-bar" class="hidden fixed bottom-0 left-64 right-0 bg-[#12192B] text-white px-6 py-3.5 flex items-center justify-between gap-4 z-40" style="box-shadow:0 -4px 14px rgba(0,0,0,0.18);">
  <div class="text-sm">已選擇 <span id="topic-selected-count" class="font-bold text-[var(--accent)]">0</span> / <span id="topic-total-count">0</span> 個選題</div>
  <div class="flex items-center gap-3">
    <button id="topic-clear-btn" class="px-4 py-2 rounded-lg bg-white/10 text-white/60 text-sm hover:bg-white/20 transition">取消選擇</button>
    <button id="topic-handoff-btn" class="btn-primary px-4 py-2 rounded-lg text-sm">交給文案部門 →</button>
  </div>
</div>

<script>
/* ============================================================
   品牌設定（全域狀態，非 localStorage，僅存於本次瀏覽）
   ============================================================ */
let brandProfile = { name:'', industry:'', audience:'', tone:'' };

function openBrandModal(){ document.getElementById('brand-modal').classList.remove('hidden'); }
function closeBrandModal(){ document.getElementById('brand-modal').classList.add('hidden'); }
function saveBrand(){
  brandProfile.name = document.getElementById('b-name').value;
  brandProfile.industry = document.getElementById('b-industry').value;
  brandProfile.audience = document.getElementById('b-audience').value;
  brandProfile.tone = document.getElementById('b-tone').value;
  closeBrandModal();
  renderBrandBanner();
}
document.getElementById('btn-brand-setting').addEventListener('click', openBrandModal);

function brandContextString(){
  const p = brandProfile;
  if(!p.name && !p.industry && !p.audience && !p.tone) return '';
  return `【品牌背景資訊，請在生成內容時自然融入】\n品牌/IP名稱：${p.name||'未填'}\n產業領域：${p.industry||'未填'}\n目標受眾：${p.audience||'未填'}\n語氣風格：${p.tone||'未填'}\n`;
}

/* 依據其他欄位的值，動態顯示/隱藏標記了 showIf 的欄位（例如：CTA選特定選項才出現的欄位） */
function wireShowIfFields(){
  document.querySelectorAll('.field-wrap[data-show-if-key]').forEach(wrap=>{
    const key = wrap.getAttribute('data-show-if-key');
    const val = wrap.getAttribute('data-show-if-value');
    const controller = document.getElementById('f-' + key);
    if(!controller) return;
    const update = ()=>{ wrap.classList.toggle('hidden', controller.value !== val); };
    controller.addEventListener('change', update);
    controller.addEventListener('input', update);
    update();
  });
}

/* 「✨ 根據OO生成範例」按鈕：抓另一個欄位的值，用AI快速生成一段範例文字填入這個欄位 */
function wireAutoSuggestFields(mod){
  document.querySelectorAll('.auto-suggest-btn').forEach(btn=>{
    const key = btn.getAttribute('data-key');
    const field = mod.fields.find(f => f.key === key);
    if(!field) return;
    btn.addEventListener('click', ()=> runAutoSuggest(mod, field, btn));
  });
}

async function runAutoSuggest(mod, field, btn){
  const sourceField = mod.fields.find(f => f.key === field.autoSuggestFrom);
  const sourceInput = document.getElementById('f-' + field.autoSuggestFrom);
  const sourceVal = sourceInput ? sourceInput.value.trim() : '';
  if(!sourceVal){
    showToast(`請先填寫「${sourceField ? sourceField.label : field.autoSuggestFrom}」`);
    return;
  }
  const targetInput = document.getElementById('f-' + field.key);
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '生成中...';

  const promptText = `你是內容策略顧問。${brandContextString()}
${sourceField ? sourceField.label : '主題'}：${sourceVal}

請針對這個主題，直接給出「${field.label}」的具體範例內容（1-2句話、實際可用，不要說明性文字、不要加任何前綴、開場白或引號，直接給內容本身）。`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 250,
        messages: [{ role: "user", content: promptText }]
      })
    });
    const data = await response.json();
    const text = (data.content || []).map(b=>b.text || '').join('\n').trim();
    if(targetInput && text){
      targetInput.value = text;
      targetInput.classList.add('fade-in');
    }else{
      showToast('沒有取得範例內容，請再試一次。');
    }
  }catch(err){
    showToast('生成範例失敗，請稍後再試。');
    console.error(err);
  }finally{
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

/* 爆款拆解：貼上連結自動抓取（YouTube／TikTok用官方oEmbed，瀏覽器直接可抓，不需金鑰） */
async function runBreakdownLinkFetch(){
  const linkInput = document.getElementById('bd-link');
  const statusEl = document.getElementById('bd-fetch-status');
  const contentArea = document.getElementById('f-content');
  const url = (linkInput.value || '').trim();

  if(!url){
    statusEl.textContent = '請先貼上連結。';
    return;
  }

  const isYouTube = /youtube\.com|youtu\.be/i.test(url);
  const isTikTok = /tiktok\.com/i.test(url);

  if(/instagram\.com/i.test(url)){
    statusEl.textContent = 'Instagram目前不支援自動抓取（平台限制需登入），請直接複製貼文文字內容到下方欄位。';
    return;
  }
  if(/xiaohongshu\.com|xhslink\.com/i.test(url)){
    statusEl.textContent = '小紅書目前不支援自動抓取（無公開介面），請直接複製筆記文字內容到下方欄位。';
    return;
  }
  if(/threads\.net/i.test(url)){
    statusEl.textContent = 'Threads目前不支援自動抓取（平台限制），請直接複製貼文文字內容到下方欄位。';
    return;
  }
  if(!isYouTube && !isTikTok){
    statusEl.textContent = '無法辨識這個連結的平台，請直接複製文字內容到下方欄位。';
    return;
  }

  // YouTube且已設定後端服務網址：優先嘗試抓完整逐字稿
  if(isYouTube && ytBackendUrl){
    statusEl.textContent = '正在向逐字稿服務請求完整逐字稿，請稍候...';
    try{
      const res = await fetch(`${ytBackendUrl}/api/transcript?url=${encodeURIComponent(url)}`);
      const data = await res.json();
      if(res.ok && data.transcript){
        contentArea.value = data.transcript;
        contentArea.classList.add('fade-in');
        statusEl.textContent = `✓ 已抓到完整逐字稿（語言：${data.language || '未知'}${data.isAutoGenerated ? '，YouTube自動產生字幕' : ''}），可以直接產生分析，或先自行編修。`;
        return;
      }else{
        statusEl.textContent = `逐字稿服務回應：${data.error || '抓取失敗'}。改用標題等基本資訊。`;
      }
    }catch(err){
      console.error(err);
      statusEl.textContent = '無法連線到逐字稿服務（請確認網址是否正確、後端是否已成功部署）。改用標題等基本資訊。';
    }
  }

  // 退回oEmbed：抓標題／作者等基本metadata
  const oembedUrl = isYouTube
    ? `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`
    : `https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`;
  const platformName = isYouTube ? 'YouTube' : 'TikTok';

  try{
    const res = await fetch(oembedUrl);
    if(!res.ok) throw new Error('oEmbed fetch failed: ' + res.status);
    const data = await res.json();

    const pieces = [];
    if(data.title) pieces.push(`標題／文案：${data.title}`);
    if(data.author_name) pieces.push(`創作者：${data.author_name}`);

    if(pieces.length && contentArea){
      contentArea.value = pieces.join('\n');
      contentArea.classList.add('fade-in');
      const tip = isYouTube && !ytBackendUrl ? '（如果想抓完整逐字稿，可以在上方展開「逐字稿後端服務設定」填入你部署的網址）' : '';
      statusEl.textContent = `✓ 已從${platformName}抓到標題等基本資訊。這只是公開metadata，不含完整字幕／留言，建議你再補充貼上實際文案或口白內容，分析會更準確。${tip}`;
    }else{
      statusEl.textContent = '抓取成功，但沒有可用的文字內容，請直接貼上文字內容。';
    }
  }catch(err){
    statusEl.textContent = `抓取失敗，可能是連結格式錯誤或該則內容非公開，請直接複製文字內容到下方欄位。`;
    console.error(err);
  }
}

/* ============================================================
   歷史紀錄（全域最多保留100筆，依模組分別分頁顯示，每頁10筆）
   ============================================================ */
let historyRecords = []; // 最新的在最前面
let ytBackendUrl = ''; // 使用者自建的YouTube逐字稿後端服務網址（選填）
const historyPageByModule = {};
const HISTORY_PAGE_SIZE = 10;
const HISTORY_MAX = 100;

function formatHistTime(d){
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addHistoryRecord(mod, values, text){
  const primaryField = mod.fields[0];
  const subtitle = primaryField ? (values[primaryField.key] || values.link || '').slice(0, 28) : '';
  const record = {
    id: 'h' + Date.now() + Math.random().toString(36).slice(2, 7),
    moduleKey: currentKey,
    moduleTitle: mod.title,
    subtitle,
    content: text,
    time: new Date(),
    status: 'generated',   // generated | saved | scheduled | published
    publishDate: ''
  };
  historyRecords.unshift(record);
  if(historyRecords.length > HISTORY_MAX){
    historyRecords = historyRecords.slice(0, HISTORY_MAX);
  }
}

function renderHistorySection(mod){
  const container = document.getElementById('history-section');
  if(!container) return;
  const key = currentKey;
  const records = historyRecords.filter(r => r.moduleKey === key);

  if(records.length === 0){
    container.innerHTML = `<div class="text-xs text-[#999] bg-white/50 border border-dashed border-[#0000001f] rounded-xl px-4 py-6 text-center">目前這個模組還沒有生成紀錄，生成後會顯示在這裡。</div>`;
    return;
  }

  const totalPages = Math.max(1, Math.ceil(records.length / HISTORY_PAGE_SIZE));
  if(!historyPageByModule[key] || historyPageByModule[key] > totalPages) historyPageByModule[key] = 1;
  const page = historyPageByModule[key];
  const start = (page - 1) * HISTORY_PAGE_SIZE;
  const pageItems = records.slice(start, start + HISTORY_PAGE_SIZE);

  const rows = pageItems.map(r => `
    <div class="history-row flex items-center gap-2">
      <button class="history-title-btn flex-1 text-left px-4 py-3 bg-white rounded-lg border border-[#12192B]/15 hover:border-[var(--accent)] transition flex items-center justify-between gap-3 min-w-0" data-id="${r.id}">
        <span class="text-sm font-medium truncate">${escapeHtml(r.subtitle || r.moduleTitle)}</span>
        <span class="text-[11px] text-[#999] shrink-0">${formatHistTime(r.time)}</span>
      </button>
      <button class="history-delete-btn shrink-0 w-9 h-[42px] flex items-center justify-center rounded-lg border border-[#12192B]/15 text-[#B0433F] hover:bg-[#B0433F] hover:text-white transition" data-id="${r.id}" title="刪除這筆紀錄">🗑️</button>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="space-y-2">${rows}</div>
    <div class="flex items-center justify-between mt-3 text-xs text-[#666]">
      <span>共 ${records.length} 筆</span>
      <div class="flex items-center gap-3">
        <button id="hist-prev" class="px-2.5 py-1 rounded border border-[#12192B]/20 ${page<=1?'opacity-30 pointer-events-none':''}">‹ 上一頁</button>
        <span>第 ${page} / ${totalPages} 頁</span>
        <button id="hist-next" class="px-2.5 py-1 rounded border border-[#12192B]/20 ${page>=totalPages?'opacity-30 pointer-events-none':''}">下一頁 ›</button>
      </div>
    </div>
  `;

  container.querySelectorAll('.history-title-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> openHistoryDetail(btn.getAttribute('data-id')));
  });
  container.querySelectorAll('.history-delete-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteHistoryRecord(btn.getAttribute('data-id'), mod);
    });
  });
  const prevBtn = document.getElementById('hist-prev');
  const nextBtn = document.getElementById('hist-next');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ historyPageByModule[key] = Math.max(1, page-1); renderHistorySection(mod); });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ historyPageByModule[key] = Math.min(totalPages, page+1); renderHistorySection(mod); });
}

function deleteHistoryRecord(id, mod){
  const idx = historyRecords.findIndex(r => r.id === id);
  if(idx === -1) return;
  historyRecords.splice(idx, 1);
  renderHistorySection(mod);
}

function openHistoryDetail(id){
  const r = historyRecords.find(x => x.id === id);
  if(!r) return;
  document.getElementById('hist-detail-title').textContent = r.moduleTitle + (r.subtitle ? '｜' + r.subtitle : '');
  document.getElementById('hist-detail-time').textContent = formatHistTime(r.time);
  document.getElementById('hist-detail-content').textContent = r.content;
  document.getElementById('history-detail-modal').classList.remove('hidden');
  const copyBtn = document.getElementById('hist-detail-copy');
  copyBtn.textContent = '複製內容';
  copyBtn.onclick = ()=>{
    navigator.clipboard.writeText(r.content);
    copyBtn.textContent = '已複製 ✓';
    setTimeout(()=> copyBtn.textContent = '複製內容', 1500);
  };
  const deleteBtn = document.getElementById('hist-detail-delete');
  deleteBtn.onclick = ()=>{
    const mod = MODULES[currentKey];

let currentKey = 'home';
const openSubmenus = { 'ig-group': false };

function isChildActive(it){
  return it.submenu && it.submenu.some(c=>c.key===currentKey);
}

function renderSidebar(){
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  NAV.forEach(group=>{
    const wrap = document.createElement('div');
    if(group.section){
      const h = document.createElement('div');
      h.className = 'text-[10px] tracking-wider text-white/35 px-3 mb-1.5 font-bold';
      h.textContent = group.section;
      wrap.appendChild(h);
    }
    group.items.forEach(it=>{
      if(it.submenu){
        const isOpen = openSubmenus[it.key] || isChildActive(it);
        const parentBtn = document.createElement('button');
        parentBtn.className = 'nav-item w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-2.5 ' + (isChildActive(it) && !isOpen ? 'active' : 'text-white/75');
        parentBtn.innerHTML = `<span class="text-[13px]">${it.icon}</span><span>${it.label}</span><span class="ml-auto text-[10px] transition-transform ${isOpen?'rotate-90':''}">›</span>`;
        parentBtn.addEventListener('click', ()=>{ openSubmenus[it.key] = !openSubmenus[it.key]; renderSidebar(); });
        wrap.appendChild(parentBtn);

        if(isOpen){
          const subWrap = document.createElement('div');
          subWrap.className = 'ml-3 pl-3 border-l border-white/10 mt-0.5 space-y-0.5';
          it.submenu.forEach(sub=>{
            const subBtn = document.createElement('button');
            subBtn.className = 'nav-item w-full text-left px-3 py-2 rounded-lg flex items-center gap-2 text-[12.5px] ' + (sub.key===currentKey?'active':'text-white/65');
            subBtn.innerHTML = `<span class="text-[12px]">${sub.icon}</span><span>${sub.label}</span>`;
            subBtn.addEventListener('click', ()=>{ currentKey = sub.key; renderSidebar(); renderMain(); });
            subWrap.appendChild(subBtn);
          });
          wrap.appendChild(subWrap);
        }
        return;
      }
      const btn = document.createElement('button');
      btn.className = 'nav-item w-full text-left px-3 py-2.5 rounded-lg flex items-center gap-2.5 ' + (it.key===currentKey?'active':'text-white/75');
      btn.innerHTML = `<span class="text-[13px]">${it.icon}</span><span>${it.label}</span>` + (it.soon?'<span class="ml-auto text-[9px] bg-white/10 px-1.5 py-0.5 rounded text-white/50">籌備中</span>':'');
      btn.addEventListener('click', ()=>{ currentKey = it.key; renderSidebar(); renderMain(); });
      wrap.appendChild(btn);
    });
    nav.appendChild(wrap);
  });
}

function renderMain(){
  const el = document.getElementById('main-content');
  const statusBar = document.getElementById('topic-status-bar');
  if(currentKey !== 'topicbatch' && statusBar) statusBar.classList.add('hidden');

  if(currentKey === 'home'){
    el.innerHTML = renderHome();
    renderBrandBanner();
    refreshPipelineBoard();
    bindDashboardHandlers();
    return;
  }
  if(currentKey.startsWith('soon-')){
    el.innerHTML = renderSoon();
    return;
  }
  if(currentKey === 'caccalc'){
    el.innerHTML = renderCacCalc();
    document.getElementById('btn-calc').addEventListener('click', runCacCalc);
    return;
  }
  if(currentKey === 'topicbatch'){
    el.innerHTML = renderTopicBatchPage();
    attachTopicBatchHandlers();
    return;
  }
  if(currentKey === 'igcarousel'){
    el.innerHTML = renderCarouselPage();
    attachCarouselHandlers();
    return;
  }

  const mod = MODULES[currentKey];
  if(!mod){ el.innerHTML = '<div>模組不存在</div>'; return; }

  const isCopyModule = COPY_MODULE_KEYS.has(currentKey);
  const handoffHtml = (isCopyModule && handoffTopics.length > 0) ? `
    <div class="mb-5 bg-white/70 border border-dashed border-[#12192B]/25 rounded-xl px-4 py-3">
      <div class="text-xs font-bold text-[#12192B] mb-2">📋 從選題策劃帶入的選題，點一下套用到「${mod.fields[0] ? mod.fields[0].label : '主題'}」欄位：</div>
      <div class="flex flex-wrap gap-2">
        ${handoffTopics.map(t => (t.usedIn && t.usedIn.has(currentKey))
          ? `<span class="text-xs px-3 py-1.5 rounded-full bg-[#00000010] text-[#999] border border-[#12192B]/10 line-through cursor-not-allowed">${escapeHtml(t.title)}　已套用 ✓</span>`
          : `<button class="handoff-topic-btn text-xs px-3 py-1.5 rounded-full bg-[var(--card-gold)] border border-[#12192B]/20 hover:border-[var(--accent)] transition" data-title="${escapeHtml(t.title)}" data-tid="${t.id}">${escapeHtml(t.title)}</button>`
        ).join('')}
      </div>
    </div>
  ` : '';

  const fieldsHtml = mod.fields.map(f=>{
    const wrapClass = f.showIf ? `field-wrap hidden` : `field-wrap`;
    const wrapAttrs = f.showIf ? `data-show-if-key="${f.showIf.key}" data-show-if-value="${f.showIf.value}"` : '';
    if(f.type==='textarea'){
      const suggestBtnHtml = f.autoSuggestFrom
        ? `<button type="button" class="auto-suggest-btn text-[10px] font-bold text-[#C98A1A] hover:underline" data-key="${f.key}">✨ 根據${escapeHtml((mod.fields.find(x=>x.key===f.autoSuggestFrom)||{}).label || '上一欄')}生成範例</button>`
        : '';
      return `<div class="mb-4 ${wrapClass}" ${wrapAttrs}>
        <div class="flex items-center justify-between gap-2">
          <label class="text-xs font-bold text-[#333]">${f.label}</label>
          ${suggestBtnHtml}
        </div>
        <textarea id="f-${f.key}" rows="3" class="field-input w-full rounded-md px-3 py-2 mt-1 text-sm" placeholder="${f.placeholder||''}"></textarea>
      </div>`;
    }
    if(f.type==='select'){
      const opts = f.options.map(o=>`<option value="${o}">${o}</option>`).join('');
      return `<div class="mb-4 ${wrapClass}" ${wrapAttrs}>
        <label class="text-xs font-bold text-[#333]">${f.label}</label>
        <select id="f-${f.key}" class="field-input w-full rounded-md px-3 py-2 mt-1 text-sm bg-white">${opts}</select>
      </div>`;
    }
    return `<div class="mb-4 ${wrapClass}" ${wrapAttrs}>
      <label class="text-xs font-bold text-[#333]">${f.label}</label>
      <input id="f-${f.key}" class="field-input w-full rounded-md px-3 py-2 mt-1 text-sm" placeholder="${f.placeholder||''}">
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="mb-5">
      <h1 class="text-2xl font-black display">${mod.title}</h1>
      <p class="text-sm text-[#666] mt-1">${mod.desc}</p>
    </div>

    <div id="brand-banner" class="text-[11px] text-[#665] bg-[#EFE9D6] border border-[#DDD3B0] rounded-lg px-3 py-2 mb-5"></div>

    ${handoffHtml}

    <div class="grid md:grid-cols-2 gap-6">
      <div class="${mod.color} rounded-2xl p-6 card-note">
        ${currentKey === 'breakdown' ? `
        <div class="mb-4 bg-white/60 rounded-lg p-3 border border-dashed border-[#12192B]/25">
          <label class="text-xs font-bold text-[#333]">貼上連結自動抓取（YouTube可抓完整逐字稿，TikTok僅抓標題）</label>
          <div class="flex gap-2 mt-1.5">
            <input id="bd-link" class="field-input flex-1 rounded-md px-3 py-2 text-sm" placeholder="貼上 YouTube 或 TikTok 連結...">
            <button id="bd-fetch-btn" type="button" class="btn-primary rounded-lg px-4 py-2 text-xs whitespace-nowrap">🔗 抓取</button>
          </div>
          <div id="bd-fetch-status" class="text-[11px] text-[#777] mt-1.5">Instagram、小紅書、Threads因平台限制（需登入／無公開介面），暫不支援自動抓取，請直接貼上文字內容到下方欄位。</div>
          <details class="mt-2">
            <summary class="text-[11px] text-[#888] cursor-pointer hover:underline">⚙️ 逐字稿後端服務設定（選填，部署後才能抓YouTube完整逐字稿）</summary>
            <div class="mt-2">
              <input id="bd-backend-url" class="field-input w-full rounded-md px-3 py-2 text-xs" placeholder="貼上你部署好的Vercel網址，例：https://xxx.vercel.app" value="${ytBackendUrl}">
              <div class="text-[10px] text-[#999] mt-1">沒有填的話，YouTube連結一樣可以抓標題，只是不會有完整逐字稿。</div>
            </div>
          </details>
        </div>
        ` : ''}
        ${fieldsHtml}
        <button id="btn-generate" class="btn-primary rounded-lg px-5 py-2.5 text-sm mt-2">✨ 生成內容</button>
      </div>

      <div class="bg-white rounded-2xl p-6 card-note min-h-[240px]">
        <div class="text-xs font-bold text-[#888] mb-2">${mod.outputSplit ? '生成結果（腳本／頁面內容）' : '生成結果'}</div>
        <div id="result-area" class="text-sm text-[#222] prose-output">尚未生成，填寫左側欄位後按下「生成內容」。</div>
        <div class="flex items-center gap-4 mt-4">
          <button id="btn-copy" class="hidden text-xs underline font-bold">複製內容</button>
          <button id="btn-regenerate" class="hidden text-xs underline font-bold text-[#C98A1A]">🔄 換一版</button>
        </div>
      </div>
    </div>

    ${mod.outputSplit ? `
    <div class="bg-[var(--card-gold)] rounded-2xl p-6 card-note mt-6">
      <div class="text-xs font-bold text-[#12192B] mb-2">📋 可直接貼的IG貼文文案</div>
      <div id="result-caption-area" class="text-sm text-[#222] prose-output">生成完成後，會自動整理出可以直接複製貼上IG的貼文文案。</div>
      <button id="btn-copy-caption" class="hidden text-xs mt-4 underline font-bold">複製貼文文案</button>
    </div>
    ` : ''}

    <div class="mt-8">
      <div class="text-xs font-bold text-[#888] mb-2">📜 歷史紀錄（點標題可查看完整內容，最多保留100筆，每頁10筆）</div>
      <div id="history-section"></div>
    </div>
  `;

  renderBrandBanner();
  wireShowIfFields();
  wireAutoSuggestFields(mod);
  document.getElementById('btn-generate').addEventListener('click', ()=>runGenerate(mod));
  document.getElementById('btn-regenerate').addEventListener('click', ()=>runGenerate(mod, {variation:true}));
  if(currentKey === 'breakdown'){
    document.getElementById('bd-fetch-btn').addEventListener('click', runBreakdownLinkFetch);
    document.getElementById('bd-backend-url').addEventListener('change', (e)=>{
      ytBackendUrl = e.target.value.trim().replace(/\/$/, '');
    });
  }
  renderHistorySection(mod);
  if(isCopyModule && mod.fields[0]){
    document.querySelectorAll('.handoff-topic-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const targetInput = document.getElementById('f-' + mod.fields[0].key);
        if(targetInput) targetInput.value = btn.getAttribute('data-title');

        const tid = btn.getAttribute('data-tid');
        const topic = handoffTopics.find(t => t.id === tid);
        if(topic){
          if(!topic.usedIn) topic.usedIn = new Set();
          topic.usedIn.add(currentKey);
        }

        const usedSpan = document.createElement('span');
        usedSpan.className = 'text-xs px-3 py-1.5 rounded-full bg-[#00000010] text-[#999] border border-[#12192B]/10 line-through cursor-not-allowed';
        usedSpan.textContent = btn.getAttribute('data-title') + '　已套用 ✓';
        btn.replaceWith(usedSpan);
      });
    });
  }
}

      <p class="text-sm text-[#666] mt-2">今天是 ${dateStr}，適合更新一輪 IP定位、熱門拆解與各平台內容。</p>
    </div>

function computeDashboardStats(){
  const byDept = {};
  const byModule = {};
  historyRecords.forEach(r=>{
    const dept = MODULE_DEPARTMENT[r.moduleKey] || '其他';
    byDept[dept] = (byDept[dept] || 0) + 1;
    byModule[r.moduleTitle] = (byModule[r.moduleTitle] || 0) + 1;
  });
  let topModule = null, topCount = 0;
  Object.entries(byModule).forEach(([k, v])=>{ if(v > topCount){ topCount = v; topModule = k; } });

  const topicsGenerated = topicBatchItems.length;
  const topicsUsedCount = topicBatchItems.filter(t => t.usedIn && t.usedIn.size > 0).length;

  const brandFilled = [brandProfile.name, brandProfile.industry, brandProfile.audience, brandProfile.tone].filter(Boolean).length;
  const brandPct = Math.round(brandFilled / 4 * 100);

  return { total: historyRecords.length, byDept, topModule, topicsGenerated, topicsUsedCount, brandPct };
}

function runCacCalc(){
  const imp = parseFloat(document.getElementById('c-impressions').value);
  const leads = parseFloat(document.getElementById('c-leads').value);
  const sales = parseFloat(document.getElementById('c-sales').value);
  const cost = parseFloat(document.getElementById('c-cost').value);
  const resultEl = document.getElementById('calc-result');

  if([imp,leads,sales,cost].some(n=>isNaN(n) || n < 0) || imp===0){
    resultEl.innerHTML = `<span class="text-red-600">請完整填寫所有欄位（曝光數需大於0）。</span>`;
    return;
  }

  const leadRate = (leads / imp * 100);
  const closeRate = leads > 0 ? (sales / leads * 100) : 0;
  const overallRate = (sales / imp * 100);
  const cac = sales > 0 ? (cost / sales) : null;
  const costPerLead = leads > 0 ? (cost / leads) : null;

  resultEl.innerHTML = `
    <div class="flex justify-between border-b border-[#eee] pb-2"><span>導流轉化率（曝光→留資）</span><span class="font-bold">${leadRate.toFixed(2)}%</span></div>
    <div class="flex justify-between border-b border-[#eee] pb-2"><span>成交轉化率（留資→成交）</span><span class="font-bold">${closeRate.toFixed(2)}%</span></div>
    <div class="flex justify-between border-b border-[#eee] pb-2"><span>整體轉化率（曝光→成交）</span><span class="font-bold">${overallRate.toFixed(3)}%</span></div>
    <div class="flex justify-between border-b border-[#eee] pb-2"><span>平均每個名單成本</span><span class="font-bold">${costPerLead!==null? 'NT$'+costPerLead.toFixed(0) : '—'}</span></div>
    <div class="flex justify-between pb-2"><span>平均獲客成本（CAC）</span><span class="font-bold">${cac!==null? 'NT$'+cac.toFixed(0) : '尚無成交'}</span></div>
    <div class="text-xs text-[#888] mt-3 pt-3 border-t border-[#eee]">
      ${closeRate < 5 && leads>0 ? '成交轉化率偏低，可能是留資後的跟進話術或報價流程需要優化，建議搭配「私域經營手」與「銷售成交話術手」調整。' : '整體漏斗數字看起來還算健康，可以持續追蹤趨勢，觀察每次內容發布後的變化。'}
    </div>
  `;
}

async function generateTopicBatch(){
  const direction = document.getElementById('tb-direction').value.trim();
  const count = document.getElementById('tb-count').value;
  const listArea = document.getElementById('topic-list-area');
  const genBtn = document.getElementById('tb-generate-btn');

  if(!direction){
    listArea.innerHTML = `<div class="text-sm text-red-600 px-1">請先填寫主題方向／關鍵字。</div>`;
    return;
  }

  genBtn.disabled = true;
  genBtn.textContent = '生成中...';
  listArea.innerHTML = `<div class="text-sm loading-dot px-1">正在生成 ${count} 個選題，請稍候...</div>`;

  const promptText = `你是內容選題策劃師。${brandContextString()}
主題方向／關鍵字：${direction}

請產出 ${count} 個具體的內容選題。每個選題請包含：
- title：選題標題（要有鉤子，能讓人想點開）
- type：主題類型（例如：迷思破解、實戰案例、教學攻略、觀點犀利、清單整理、故事分享等，挑一個最貼切的標籤）
- detail：這個選題的詳細說明（3-4句話，包含適合的內容切入角度、目標受眾痛點、建議適合的平台）

請「只回傳」一個JSON陣列，不要有任何其他文字、說明或markdown code block標記。格式範例：
[{"title":"...","type":"...","detail":"..."}]`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4000,
        messages: [{ role: "user", content: promptText }]
      })
    });
    const data = await response.json();
    let text = (data.content || []).map(b=>b.text || '').join('\n').trim();
    text = text.replace(/^```json/i, '').replace(/^```/,'').replace(/```$/,'').trim();

    let parsed;
    try{
      parsed = JSON.parse(text);
    }catch(e){
      listArea.innerHTML = `<div class="text-sm text-red-600 px-1">生成結果解析失敗，請再試一次。</div>`;
      genBtn.disabled = false;
      genBtn.textContent = '✨ 批次生成選題';
      return;
    }

    topicBatchItems = parsed.slice(0, 20).map((item, idx)=>({
      id: 'tb' + Date.now() + '_' + idx,
      number: idx + 1,
      title: item.title || '（未命名選題）',
      type: item.type || '一般',
      detail: item.detail || '',
      usedIn: new Set()
    }));
    selectedTopicIds = new Set();
    renderTopicList();
    updateTopicStatusBar();
  }catch(err){
    listArea.innerHTML = `<div class="text-sm text-red-600 px-1">生成失敗，請稍後再試。</div>`;
    console.error(err);
  }finally{
    genBtn.disabled = false;
    genBtn.textContent = '✨ 批次生成選題';
  }
}

function renderTopicList(){
  const listArea = document.getElementById('topic-list-area');
  if(!listArea) return;

  if(topicBatchItems.length === 0){
    listArea.innerHTML = `<div class="text-xs text-[#999] bg-white/50 border border-dashed border-[#0000001f] rounded-xl px-4 py-8 text-center">填寫主題方向後按下「批次生成選題」，選題會列在這裡。</div>`;
    return;
  }

  const rows = topicBatchItems.map(item=>{
    const isSelected = selectedTopicIds.has(item.id);
    const usedCount = item.usedIn ? item.usedIn.size : 0;
    return `
    <div class="flex items-center gap-3 bg-white rounded-lg border ${isSelected ? 'border-[var(--accent)]' : 'border-[#12192B]/15'} px-4 py-3">
      <span class="text-xs font-bold text-[#999] w-6 shrink-0">${item.number}</span>
      <button class="topic-title-btn flex-1 text-left min-w-0" data-id="${item.id}">
        <div class="text-sm font-medium truncate">${escapeHtml(item.title)}</div>
      </button>
      ${usedCount > 0 ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-[#00000010] text-[#888] shrink-0">已套用 ${usedCount} 處</span>` : ''}
      <span class="text-[11px] px-2 py-0.5 rounded-full bg-[var(--card-teal)] shrink-0">${escapeHtml(item.type)}</span>
      <button class="topic-select-btn shrink-0 text-xs px-3 py-1.5 rounded-lg border transition ${isSelected ? 'bg-[var(--accent)] border-[#12192B] font-bold' : 'border-[#12192B]/25 hover:border-[var(--accent)]'}" data-id="${item.id}">
        ${isSelected ? '已選 ✓' : '選擇'}
      </button>
    </div>`;
  }).join('');

  listArea.innerHTML = `<div class="space-y-2">${rows}</div>`;

  listArea.querySelectorAll('.topic-title-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> openTopicDetail(btn.getAttribute('data-id')));
  });
  listArea.querySelectorAll('.topic-select-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleTopicSelect(btn.getAttribute('data-id')));
  });
}

function toggleTopicSelect(id){
  if(selectedTopicIds.has(id)){
    selectedTopicIds.delete(id);
  }else{
    if(selectedTopicIds.size >= TOPIC_BATCH_MAX_SELECT){
      showToast(`最多只能選擇 ${TOPIC_BATCH_MAX_SELECT} 個選題喔，請先取消一個再選新的。`);
      return;
    }
    selectedTopicIds.add(id);
  }
  renderTopicList();
  updateTopicStatusBar();
}

let toastTimer = null;
function showToast(msg){
  let toast = document.getElementById('app-toast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'app-toast';
    toast.className = 'fixed top-6 left-1/2 -translate-x-1/2 bg-[#12192B] text-white text-sm px-4 py-2.5 rounded-lg z-50 shadow-lg';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toast.style.display = 'none'; }, 2200);
}

function updateTopicStatusBar(){
  const bar = document.getElementById('topic-status-bar');
  if(!bar) return;
  if(topicBatchItems.length === 0){
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  document.getElementById('topic-selected-count').textContent = selectedTopicIds.size;
  document.getElementById('topic-total-count').textContent = topicBatchItems.length;
  const clearBtn = document.getElementById('topic-clear-btn');
  const handoffBtn = document.getElementById('topic-handoff-btn');
  const hasSelection = selectedTopicIds.size > 0;
  clearBtn.disabled = !hasSelection;
  handoffBtn.disabled = !hasSelection;
  clearBtn.classList.toggle('opacity-40', !hasSelection);
  handoffBtn.classList.toggle('opacity-40', !hasSelection);
}

function clearTopicSelection(){
  selectedTopicIds = new Set();
  renderTopicList();
  updateTopicStatusBar();
}

function handoffToCopyDept(){
  if(selectedTopicIds.size === 0) return;
  handoffTopics = topicBatchItems.filter(item => selectedTopicIds.has(item.id));
  currentKey = 'xhs';
  renderSidebar();
  renderMain();
}

function openTopicDetail(id){
  const item = topicBatchItems.find(x => x.id === id);
  if(!item) return;
  document.getElementById('topic-detail-title').textContent = item.title;
  document.getElementById('topic-detail-type').textContent = item.type;
  document.getElementById('topic-detail-content').textContent = item.detail;
  const selectBtn = document.getElementById('topic-detail-select-btn');
  const isSelected = selectedTopicIds.has(item.id);
  selectBtn.textContent = isSelected ? '取消已選' : '加入已選';
  selectBtn.setAttribute('data-id', item.id);
  document.getElementById('topic-detail-modal').classList.remove('hidden');
}
function closeTopicDetail(){
  document.getElementById('topic-detail-modal').classList.add('hidden');
}

/* ============================================================
   IG圖文卡手：樣板卡片生成 + PNG下載
   ============================================================ */
let carouselSlides = [];
let carouselCaption = '';

const CARD_ROLE_STYLE = {
  cover: {
    bg:   'linear-gradient(150deg, #0F1526 0%, #12192B 45%, #263255 100%)',
    text: '#F5F1E8',
    sub:  'rgba(245,241,232,0.62)',
    accent: 'var(--accent)',
    kicker: 'COVER · 封面'
  },
  content: {
    bg:   '#FBF8F0',
    text: '#12192B',
    sub:  '#5B6472',
    accent: null,
    kicker: 'CONTENT · 內容'
  },
  end: {
    bg:   'linear-gradient(150deg, #0F1526 0%, #12192B 45%, #263255 100%)',
    text: '#F5F1E8',
    sub:  'rgba(245,241,232,0.62)',
    accent: 'var(--accent)',
    kicker: 'CTA · 結尾'
  },
};
const CONTENT_ACCENTS = ['#BFDEDC', '#D9D6ED', '#CDE1EF'];

function renderCarouselPage(){

  const handoffHtml = (handoffTopics.length > 0) ? `
    <div class="mb-5 bg-white/70 border border-dashed border-[#12192B]/25 rounded-xl px-4 py-3">
      <div class="text-xs font-bold text-[#12192B] mb-2">📋 從選題策劃帶入的選題，點一下套用到「主題」欄位：</div>

        ${handoffTopics.map(t => (t.usedIn && t.usedIn.has(currentKey))

          : `<button class="handoff-topic-btn text-xs px-3 py-1.5 rounded-full bg-[var(--card-gold)] border border-[#12192B]/20 hover:border-[var(--accent)] transition" data-title="${escapeHtml(t.title)}" data-tid="${t.id}">${escapeHtml(t.title)}</button>`

    <div class="mb-5">

    </div>

    <div id="brand-banner" class="text-[11px] text-[#665] bg-[#EFE9D6] border border-[#DDD3B0] rounded-lg px-3 py-2 mb-5"></div>

    ${handoffHtml}

    <div class="${mod.color} rounded-2xl p-6 card-note mb-6">
      <div class="grid md:grid-cols-3 gap-4 items-end">
        <div class="md:col-span-2">
          <label class="text-xs font-bold text-[#333]">主題</label>
          <input id="cc-topic" class="field-input w-full rounded-md px-3 py-2 mt-1 text-sm" placeholder="例：經營自媒體的3個常見迷思">
        </div>
        <div>
          <label class="text-xs font-bold text-[#333]">預計頁數</label>
          <select id="cc-slides" class="field-input w-full rounded-md px-3 py-2 mt-1 text-sm bg-white">
            <option value="5">5頁</option>
            <option value="7">7頁</option>
            <option value="10">10頁</option>
          </select>
        </div>
      </div>
      <button id="cc-generate-btn" class="btn-primary rounded-lg px-5 py-2.5 text-sm mt-4">✨ 生成圖文卡內容</button>
    </div>

    <div id="cc-caption-box" class="bg-white rounded-2xl p-6 card-note mb-6 hidden">
      <div class="text-xs font-bold text-[#888] mb-2">📋 可直接貼的IG貼文文案</div>
      <div id="cc-caption-text" class="text-sm text-[#222] prose-output"></div>
      <button id="cc-copy-caption-btn" class="text-xs mt-4 underline font-bold">複製貼文文案</button>

function attachCarouselHandlers(){
  const mod = MODULES['igcarousel'];
  renderBrandBanner();
  document.getElementById('cc-generate-btn').addEventListener('click', ()=>generateCarouselCards());
  document.getElementById('cc-regenerate-btn').addEventListener('click', ()=>generateCarouselCards({variation:true}));
  renderHistorySection(mod);

  document.querySelectorAll('.handoff-topic-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const targetInput = document.getElementById('cc-topic');
      if(targetInput) targetInput.value = btn.getAttribute('data-title');

      const tid = btn.getAttribute('data-tid');
      const topic = handoffTopics.find(t => t.id === tid);
      if(topic){
        if(!topic.usedIn) topic.usedIn = new Set();
        topic.usedIn.add(currentKey);
      }

      const usedSpan = document.createElement('span');
      usedSpan.className = 'text-xs px-3 py-1.5 rounded-full bg-[#00000010] text-[#999] border border-[#12192B]/10 line-through cursor-not-allowed';
      usedSpan.textContent = btn.getAttribute('data-title') + '　已套用 ✓';
      btn.replaceWith(usedSpan);
    });
  });

  // 若已有先前生成的卡片資料，切回這頁時重新渲染（不用重打API）
  if(carouselSlides.length > 0){
    renderCarouselResult(carouselCaption, carouselSlides);
  }
}

async function generateCarouselCards(opts={}){
  const mod = MODULES['igcarousel'];
  const topic = document.getElementById('cc-topic').value.trim();
  const count = parseInt(document.getElementById('cc-slides').value, 10);
  const genBtn = document.getElementById('cc-generate-btn');
  const regenBtn = document.getElementById('cc-regenerate-btn');
  const cardsArea = document.getElementById('cc-cards-area');
  const cardsHeader = document.getElementById('cc-cards-header');
  const captionBox = document.getElementById('cc-caption-box');

  if(!topic){
    cardsArea.innerHTML = `<div class="text-sm text-red-600 px-1 col-span-full">請先填寫主題。</div>`;
    return;
  }

  genBtn.disabled = true;
  regenBtn.disabled = true;
  if(opts.variation){
    regenBtn.textContent = '換一版中...';
  }else{
    genBtn.textContent = '生成中...';
  }
  captionBox.classList.add('hidden');
  if(!opts.variation) cardsHeader.classList.add('hidden');
  cardsArea.innerHTML = `<div class="text-sm loading-dot px-1 col-span-full">${opts.variation ? '正在生成新的一版，請稍候...' : `正在生成 ${count} 頁圖文卡，請稍候...`}</div>`;

  let promptText = mod.prompt({topic}, brandContextString(), count);
  if(opts.variation){
    promptText += `\n\n（這是「換一版」的請求：請提供跟前一版不同的切入角度、標題寫法或文字風格，避免重複相同的表達方式。）`;
  }

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: mod.maxTokens || 1800,
        messages: [{ role: "user", content: promptText }]
      })
    });
    const data = await response.json();
    let text = (data.content || []).map(b=>b.text || '').join('\n').trim();
    text = text.replace(/^```json/i, '').replace(/^```/,'').replace(/```$/,'').trim();

    let parsed;
    try{
      parsed = JSON.parse(text);
    }catch(e){
      cardsArea.innerHTML = `<div class="text-sm text-red-600 px-1 col-span-full">生成結果解析失敗，請再試一次。</div>`;
      genBtn.disabled = false;
      genBtn.textContent = '✨ 生成圖文卡內容';
      regenBtn.disabled = false;
      regenBtn.textContent = '🔄 換一版';
      return;
    }

    carouselCaption = parsed.caption || '';
    carouselSlides = (parsed.slides || []).slice(0, 10);
    renderCarouselResult(carouselCaption, carouselSlides);

    const summaryText = `【貼文文案】\n${carouselCaption}\n\n【逐頁內容】\n` +
      carouselSlides.map((s,i)=>`第${i+1}頁（${s.role}）\n標題：${s.headline}\n內容：${s.body}`).join('\n\n');
    addHistoryRecord(mod, {topic}, summaryText);
    renderHistorySection(mod);
  }catch(err){
    cardsArea.innerHTML = `<div class="text-sm text-red-600 px-1 col-span-full">生成失敗，請稍後再試。</div>`;
    console.error(err);
  }finally{
    genBtn.disabled = false;
    genBtn.textContent = '✨ 生成圖文卡內容';
    regenBtn.disabled = false;
    regenBtn.textContent = '🔄 換一版';
  }
}

function renderCarouselResult(caption, slides){
  const captionBox = document.getElementById('cc-caption-box');
  const captionText = document.getElementById('cc-caption-text');
  const cardsHeader = document.getElementById('cc-cards-header');
  const cardsArea = document.getElementById('cc-cards-area');
  if(!cardsArea) return;

  if(caption){
    captionText.textContent = caption;
    captionBox.classList.remove('hidden');
    const copyBtn = document.getElementById('cc-copy-caption-btn');
    copyBtn.onclick = ()=>{
      navigator.clipboard.writeText(caption);
      copyBtn.textContent = '已複製 ✓';
      setTimeout(()=>copyBtn.textContent='複製貼文文案', 1500);
    };
  }

  if(slides.length === 0){
    cardsArea.innerHTML = '';
    cardsHeader.classList.add('hidden');
    return;
  }

  cardsHeader.classList.remove('hidden');
  const brandTag = (brandProfile.name || 'daxing');

  cardsArea.innerHTML = slides.map((s, idx)=>{
    const style = CARD_ROLE_STYLE[s.role] || CARD_ROLE_STYLE.content;
    const accentColor = style.accent || CONTENT_ACCENTS[idx % CONTENT_ACCENTS.length];
    const isDark = (s.role === 'cover' || s.role === 'end');
    const ruleColor = isDark ? 'rgba(245,241,232,0.18)' : 'rgba(18,25,43,0.12)';
    const headline = escapeHtml(s.headline||'');
    const body = escapeHtml(s.body||'');
    const bodyBlock = (s.role === 'end')
      ? `<div class="inline-block px-3 py-2.5 rounded-lg mt-1" style="background:rgba(240,180,41,0.14); border:1px solid var(--accent);">
           <div class="text-xs leading-relaxed" style="color:${style.text};">${body}</div>
         </div>`
      : `<div class="text-xs leading-relaxed" style="color:${style.sub};">${body}</div>`;

    return `
    <div>
      <div id="cc-card-${idx}" class="w-full aspect-[4/5] rounded-2xl overflow-hidden relative" style="background:${style.bg};">
        <div class="absolute -right-6 -bottom-8 text-[150px] leading-none font-black select-none pointer-events-none" style="color:${style.text}; opacity:0.05;">◎</div>
        ${!isDark ? `<div class="absolute top-0 left-0 right-0 h-[6px]" style="background:${accentColor};"></div>` : ''}

        <div class="relative h-full flex flex-col justify-between p-7">
          <div class="flex items-center justify-between">
            <span class="text-[9px] font-bold tracking-[0.15em] uppercase" style="color:${style.sub};">${style.kicker}</span>
            <span class="text-[9px] font-bold tracking-widest" style="color:${style.sub};">${String(idx+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span>
          </div>

          <div>
            <div class="w-9 h-[3px] rounded-full mb-3" style="background:${accentColor};"></div>
            <div class="text-xl font-black display leading-snug mb-2.5" style="color:${style.text};">${headline}</div>
            ${bodyBlock}
          </div>

          <div class="flex items-center gap-1.5 pt-3" style="border-top:1px solid ${ruleColor};">
            <span class="text-[10px] font-black" style="color:${style.accent || accentColor};">◎</span>
            <span class="text-[9px] font-bold tracking-wide uppercase" style="color:${style.sub};">${escapeHtml(brandTag)}</span>
          </div>
        </div>
      </div>
      <button class="cc-download-btn w-full text-xs mt-2 px-3 py-1.5 rounded-lg border border-[#12192B]/20 hover:border-[var(--accent)] transition" data-idx="${idx}">下載這張圖片</button>
    </div>`;
  }).join('');

  cardsArea.querySelectorAll('.cc-download-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> downloadCarouselCard(parseInt(btn.getAttribute('data-idx'),10)));
  });

  const downloadAllBtn = document.getElementById('cc-download-all-btn');
  if(downloadAllBtn) downloadAllBtn.onclick = downloadAllCarouselCards;
}

function downloadCarouselCard(idx){
  const el = document.getElementById('cc-card-' + idx);
  if(!el || typeof html2canvas === 'undefined') return;
  html2canvas(el, { scale: 3, backgroundColor: null }).then(canvas=>{
    const link = document.createElement('a');
    link.download = `圖文卡-第${idx+1}頁.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

async function downloadAllCarouselCards(){
  for(let i = 0; i < carouselSlides.length; i++){
    downloadCarouselCard(i);
    await new Promise(r => setTimeout(r, 400));
  }
}

/* ============================================================
   呼叫 Claude API
   ============================================================ */
async function runGenerate(mod, opts={}){
  const values = {};
  mod.fields.forEach(f=>{ values[f.key] = document.getElementById('f-'+f.key).value; });

  const resultArea = document.getElementById('result-area');
  const btn = document.getElementById('btn-generate');
  const regenBtn = document.getElementById('btn-regenerate');
  const copyBtn = document.getElementById('btn-copy');

  if(currentKey === 'breakdown'){
    const linkInput = document.getElementById('bd-link');
    values.link = linkInput ? linkInput.value.trim() : '';
    if(!values.content.trim() && !values.link.trim()){
      resultArea.innerHTML = `<span class="text-red-600">請貼上連結，或直接貼上文字內容，兩者擇一即可。</span>`;
      return;
    }
  }

  const missing = mod.fields.filter(f=>!f.optional && (!values[f.key] || !values[f.key].trim()));
  if(missing.length){
    resultArea.innerHTML = `<span class="text-red-600">請先填寫「${missing[0].label}」再產生內容。</span>`;
    return;
  }

  btn.disabled = true;
  regenBtn.disabled = true;
  if(opts.variation){
    regenBtn.textContent = '換一版中...';
  }else{
    btn.textContent = '生成中...';
  }
  copyBtn.classList.add('hidden');
  resultArea.innerHTML = `<span class="loading-dot">${opts.variation ? '正在生成新的一版，請稍候...' : '正在生成內容，請稍候...'}</span>`;

  let promptText = mod.prompt(values, brandContextString());
  if(opts.variation){
    promptText += `\n\n（這是「換一版」的請求：請提供跟一般常見寫法不同的切入角度、開頭方式或用詞，避免落入固定套路，讓這一版讀起來有明顯不同的風格。）`;
  }

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: mod.maxTokens || 1000,
        messages: [{ role: "user", content: promptText }]
      })
    });
    const data = await response.json();
    const text = (data.content || []).map(b=>b.text || '').join('\n').trim();

    let mainText = text;
    let captionText = '';
    if(mod.outputSplit && text.includes(mod.outputSplit)){
      const parts = text.split(mod.outputSplit);
      mainText = parts[0].trim();
      captionText = parts.slice(1).join(mod.outputSplit).trim();
    }

    resultArea.textContent = mainText || '沒有取得內容，請再試一次。';
    resultArea.classList.add('fade-in');
    copyBtn.classList.remove('hidden');
    regenBtn.classList.remove('hidden');
    copyBtn.onclick = ()=>{
      navigator.clipboard.writeText(mainText);
      copyBtn.textContent = '已複製 ✓';
      setTimeout(()=>copyBtn.textContent='複製內容', 1500);
    };

    if(mod.outputSplit){
      const captionArea = document.getElementById('result-caption-area');
      const captionCopyBtn = document.getElementById('btn-copy-caption');
      if(captionArea){
        if(captionText){
          captionArea.textContent = captionText;
          captionArea.classList.add('fade-in');
          captionCopyBtn.classList.remove('hidden');
          captionCopyBtn.onclick = ()=>{
            navigator.clipboard.writeText(captionText);
            captionCopyBtn.textContent = '已複製 ✓';
            setTimeout(()=>captionCopyBtn.textContent='複製貼文文案', 1500);
          };
        }else{
          captionArea.textContent = '沒有偵測到獨立的貼文文案，請參考左側主要內容。';
          captionCopyBtn.classList.add('hidden');
        }
      }
    }

    if(text){
      addHistoryRecord(mod, values, text);
      renderHistorySection(mod);
    }
  }catch(err){
    resultArea.innerHTML = `<span class="text-red-600">生成失敗，請稍後再試。</span>`;
    console.error(err);
  }finally{
    btn.disabled = false;
    btn.textContent = '✨ 生成內容';
    regenBtn.disabled = false;
    regenBtn.textContent = '🔄 換一版';
  }
}
